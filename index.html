<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f1f" />
    <title>Pipe Slide — Pull the Pin</title>
    <meta
      name="description"
      content="Pull the pins, slide the payload down the glass pipes and keep everyone happy."
    />
    <!-- CrazyGames SDK (no-op locally; the game degrades to localStorage) -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <style>
      :root {
        --bg-0: #070a16;
        --bg-1: #141a35;
        --bg-2: #2b1d4d;
        --hi: #ffd54a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-0);
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(1200px 700px at 50% -10%, #3a2a6b 0%, transparent 60%),
          radial-gradient(900px 600px at 10% 110%, #123a52 0%, transparent 55%),
          linear-gradient(160deg, var(--bg-1), var(--bg-0) 55%, #05070f);
      }
      canvas {
        display: block;
        touch-action: none;
        border-radius: 10px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65);
      }

      /* ---------- boot splash ---------- */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 50;
        background:
          radial-gradient(900px 600px at 50% 20%, #34275f 0%, transparent 65%),
          linear-gradient(170deg, #171d3c, #070a16);
        transition: opacity 0.45s ease;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      .boot-inner {
        text-align: center;
        transform: translateY(-4vh);
      }
      .boot-title {
        font-size: clamp(34px, 8vw, 64px);
        font-weight: 900;
        letter-spacing: 2px;
        background: linear-gradient(180deg, #fff6c9, #ffcf3d 55%, #ff9a2e);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 6px 26px rgba(255, 176, 46, 0.35);
      }
      .boot-sub {
        margin-top: 6px;
        color: #93a0d0;
        font-size: 14px;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      /* a little pipe with a coin dropping through it */
      .pipe {
        position: relative;
        width: 76px;
        height: 132px;
        margin: 30px auto 20px;
        border-left: 5px solid rgba(150, 225, 255, 0.55);
        border-right: 5px solid rgba(150, 225, 255, 0.55);
        border-radius: 8px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.13),
          rgba(255, 255, 255, 0.03) 45%,
          rgba(255, 255, 255, 0.14)
        );
        box-shadow: 0 0 26px rgba(96, 208, 255, 0.25);
        overflow: hidden;
      }
      .coin {
        position: absolute;
        left: 50%;
        width: 30px;
        height: 30px;
        margin-left: -15px;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 30%, #fff3b0, #ffc02e 55%, #d3881a);
        box-shadow: 0 0 16px rgba(255, 196, 60, 0.75);
        animation: drop 1.15s cubic-bezier(0.45, 0, 0.7, 1) infinite;
      }
      .coin:nth-child(2) {
        animation-delay: 0.38s;
      }
      .coin:nth-child(3) {
        animation-delay: 0.76s;
      }
      @keyframes drop {
        0% {
          top: -34px;
          transform: scale(0.85) rotate(0deg);
        }
        80% {
          transform: scale(1) rotate(220deg);
        }
        100% {
          top: 134px;
          transform: scale(0.9) rotate(300deg);
        }
      }
      .bar {
        width: min(280px, 62vw);
        height: 10px;
        margin: 0 auto;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 8%;
        border-radius: 99px;
        background: linear-gradient(90deg, #4ce0ff, #7cf6b0 50%, #ffd54a);
        transition: width 0.3s ease;
      }
      .boot-tip {
        margin-top: 14px;
        color: #6d78a8;
        font-size: 12.5px;
      }
      .rotate-hint {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="boot">
      <div class="boot-inner">
        <div class="boot-title">PIPE SLIDE</div>
        <div class="boot-sub">pull &middot; drop &middot; deliver</div>
        <div class="pipe">
          <span class="coin"></span><span class="coin"></span><span class="coin"></span>
        </div>
        <div class="bar"><i id="boot-bar"></i></div>
        <div class="boot-tip" id="boot-tip">warming up the pipes&hellip;</div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
